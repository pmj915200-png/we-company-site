<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>위컴퍼니 WE COMPANY</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<style id="site-css">
/* Layout: showroom index. A fixed left column (logo, comma nav, language) ruled off by one black line; the right column runs full-width photos and quiet text rows. Single light look: greige paper, black ink. */
:root{
  color-scheme:light;
  --bg:#e8e8e0; --panel:#f5f2ea; --ink:#111110; --muted:#6b6b64; --soft:#a3a39b; --hair:#cbcbc2; --dark:#1b1b19; --on-dark:#e8e8e0; --alert:#a22525;
  --f-logo:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-latin:"DM Sans",Helvetica,Arial,sans-serif;
  --f-ko:"DM Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-ja:"DM Sans","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ko);font-weight:300;font-size:14px;line-height:1.75;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
html[lang="ko"] body{word-break:keep-all}
html[lang="ja"] body{font-family:var(--f-ja);line-break:strict}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
p,h1,h2,h3,ul,ol,dl,dd,figure{margin:0}
h1,h2,h3{font-weight:400;text-wrap:balance}
.en{font-family:var(--f-latin);text-transform:uppercase;letter-spacing:.04em}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;font-size:12px;font-family:var(--f-latin);text-transform:uppercase;letter-spacing:.04em}
.link:hover{color:var(--muted)}

/* frame */
.frame{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:0 34px;padding-right:max(20px,env(safe-area-inset-right,0px));padding-left:max(30px,env(safe-area-inset-left,0px))}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-block:30px;padding-right:30px;border-right:1px solid var(--ink);display:flex;flex-direction:column;gap:22px}
.logo{display:block;font-family:var(--f-logo);font-weight:400;font-size:34px;line-height:1;letter-spacing:.01em;text-transform:uppercase;text-decoration:none;background:none;border:0;padding:0;text-align:left}
.logo small{display:block;margin-top:8px;font-family:inherit;font-size:13px;letter-spacing:.02em;text-transform:none;color:var(--muted)}
html[lang="ko"] .logo small{font-family:var(--f-ko)}
html[lang="ja"] .logo small{font-family:var(--f-ja)}
.menus{display:flex;gap:6px 20px;flex-wrap:wrap;font-family:var(--f-latin);font-size:14px;font-weight:400}
.menus nav{display:flex;flex-wrap:wrap}
.menus button{background:none;border:0;padding:0;font-weight:400}
.menus button:hover{text-decoration:underline;text-underline-offset:3px}
.menus nav button:not(:last-child)::after{content:",\00a0"}
.lang button{color:var(--soft)}
.lang button[aria-pressed="true"]{color:var(--ink)}
.side-foot{margin-top:auto;display:grid;gap:14px;font-size:12px;color:var(--muted)}
.side-foot b{display:block;font-weight:400;color:var(--ink);font-size:13px}

.main{min-width:0;padding-block:0 60px}

/* hero */
.hero{display:block}
.hero-media{position:relative;width:100%;max-width:100%;aspect-ratio:16/10;background:var(--dark);overflow:hidden}
.hero-media img{width:100%;height:100%;object-fit:cover;display:block}
.hero-type{position:absolute;inset:0;padding:clamp(20px,4vw,48px);display:flex;flex-direction:column;justify-content:space-between;color:var(--on-dark)}
.hero-type .big{font-family:var(--f-logo);text-transform:uppercase;font-size:clamp(40px,7.4vw,112px);line-height:.92;letter-spacing:-.005em}
.hero-type .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-latin);font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.hero-text{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 34px;padding-block:34px 0}
.hero-text h1{font-size:clamp(22px,2.4vw,30px);line-height:1.45;font-weight:300;letter-spacing:-.01em;white-space:pre-line}
.hero-text .sub{color:var(--muted);max-width:32em;align-self:end}
.hero-text .acts{grid-column:1/-1;display:flex;gap:24px;flex-wrap:wrap}

/* sections */
.sec{padding-block:96px 0}
.sec-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 34px;padding-bottom:22px;border-bottom:1px solid var(--ink);margin-bottom:28px;align-items:end}
.sec-h .kicker{font-family:var(--f-latin);text-transform:uppercase;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.sec-h h2{font-size:20px;line-height:1.4;margin-top:4px}
.sec-h p{color:var(--muted);max-width:36em}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 34px;align-items:start}
.intro{font-size:15px;white-space:pre-line;max-width:34em}
.list{list-style:none;padding:0;border-top:1px solid var(--hair)}
.list li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:14px 0;border-bottom:1px solid var(--hair)}
.list .n{font-family:var(--f-latin);font-size:12px;color:var(--soft);padding-top:2px;font-variant-numeric:tabular-nums}
.list b{display:block;font-weight:400}
.list span{display:block;color:var(--muted);font-size:13px}

.notice{margin-top:34px;background:var(--panel);border:1px solid var(--soft);padding:24px 26px;display:grid;gap:10px;max-width:440px}
.notice .t{font-family:var(--f-latin);text-transform:uppercase;font-size:13px;letter-spacing:.04em}
.notice .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.notice .acts{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:12px}

.steps{list-style:none;padding:0;border-top:1px solid var(--hair)}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1.3fr);gap:10px 34px;padding:16px 0;border-bottom:1px solid var(--hair)}
.steps .n{font-family:var(--f-latin);font-size:12px;color:var(--soft);padding-top:2px;font-variant-numeric:tabular-nums}
.steps b{font-weight:400}
.steps span{color:var(--muted)}
.sub-h{font-family:var(--f-latin);text-transform:uppercase;font-size:12px;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.plain{list-style:none;padding:0}
.plain li{padding:6px 0;border-bottom:1px solid var(--hair)}
.malls{font-size:15px}
.malls span:not(:last-child)::after{content:",\00a0"}
.note{margin-top:10px;font-size:12px;color:var(--muted)}

/* galleries */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 20px}
.card{display:flex;flex-direction:column;gap:12px;min-width:0}
.card .ph{display:block;width:100%;max-width:100%;padding:0;border:0;background:var(--hair);overflow:hidden;cursor:zoom-in}
.grid.factory{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.factory .ph{aspect-ratio:4/3}
.grid.products .ph{aspect-ratio:3/4}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .cap{font-size:13px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.card .cap b{display:block;font-weight:400;color:var(--ink)}
.card .cty{font-family:var(--f-latin);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
.empty{padding:56px 0;color:var(--muted);border-bottom:1px solid var(--hair)}

/* contact */
.rows{border-top:1px solid var(--hair)}
.rowc{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--hair)}
.rowc .k{color:var(--muted);font-size:13px}
.rowc .v{overflow-wrap:anywhere;user-select:all;font-weight:400}
.rowc .copy{background:none;border:0;padding:0;font-size:11px;font-family:var(--f-latin);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.pending{color:var(--muted);padding:13px 0;border-bottom:1px solid var(--hair)}
footer{margin-top:96px;padding-top:18px;border-top:1px solid var(--ink);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-latin);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* editor (Korean UI for the owner) */
.ed{display:none}
body.editing .ed{display:flex}
body.editing .ed-grid{display:grid}
.ed{gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:24px;padding:16px;border:1px dashed var(--ink);background:var(--panel)}
.ed label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:150px}
.ed input,.ed textarea,.card .tools input{border:1px solid var(--soft);background:#fff;padding:7px 9px;font-size:13px;width:100%;border-radius:0}
.ed textarea{min-height:130px;resize:vertical}
.ed-grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:28px}
.ed-grid .full{grid-column:1/-1}
.ed-grid .head{grid-column:1/-1;font-family:var(--f-latin);text-transform:uppercase;font-size:12px;letter-spacing:.06em;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:8px 14px;font-size:12px;font-family:var(--f-latin);letter-spacing:.04em;text-transform:uppercase;text-decoration:none;border-radius:0}
.btn.line{background:transparent;color:var(--ink)}
.btn.warn{background:transparent;color:var(--alert);border-color:var(--alert)}
.btn[disabled]{opacity:.45;cursor:default}
.card .tools{display:none;flex-direction:column;gap:6px}
body.editing .card .tools{display:flex}
.card .tools .b{display:flex;gap:6px;flex-wrap:wrap}
.prog{font-size:12px;color:var(--ink)}
.adminbar{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 32px)}
.adminbar .status{background:var(--panel);border:1px solid var(--soft);padding:7px 12px;font-size:12px}
.adminbar .btn.line{background:var(--panel)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 56px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-height:78vh;max-width:100%;object-fit:contain}
.lb p{font-size:13px;color:var(--muted);text-align:center}
.lb .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:max(20px,env(safe-area-inset-right,0px));background:none;border:0;font-size:22px;line-height:1}

@media (max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.frame{grid-template-columns:minmax(0,300px) minmax(0,1fr)}}
@media (max-width:860px){
  .frame{display:block;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ink);padding:20px 0 16px;gap:14px;margin-bottom:16px}
  .side-foot{display:none}
  .logo{font-size:30px}
  .hero-media{aspect-ratio:4/5}
  .hero-text,.sec-h,.two{grid-template-columns:minmax(0,1fr)}
  .steps li{grid-template-columns:32px minmax(0,1fr);gap:2px 10px}
  .steps li .n{grid-column:1;grid-row:1/3}
  .steps li b,.steps li span:not(.n){grid-column:2}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 12px}
  .grid.factory{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sec{padding-block:72px 0}
  .ed-grid{grid-template-columns:minmax(0,1fr)}
  .rowc{grid-template-columns:86px minmax(0,1fr) auto}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

  function setDirty(){dirty=true;var s=document.getElementById('save');if(s)s.disabled=saving;var t=document.getElementById('status');if(t)t.textContent='저장하지 않은 변경 사항이 있습니다';}
  function status(m){var t=document.getElementById('status');if(t)t.textContent=m;}

  function readForm(){
    if(!document.getElementById('f-name')) return;
    var I=S.info;
    ['name','nameJa','nameEn','phone','email','kakao','line'].forEach(function(k){I[k]=document.getElementById('f-'+k).value;});
    ['ko','ja'].forEach(function(l){['tagline','intro','hours','address'].forEach(function(k){I[l][k]=document.getElementById('f-'+l+'-'+k).value;});});
    document.querySelectorAll('[data-k][data-f]').forEach(function(el){var p=el.dataset.k.split(':');var it=S[p[0]][+p[1]];if(it)it[el.dataset.f]=el.value;});
  }

  function prep(file){
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)||!window.createImageBitmap) return Promise.resolve(file);
    return createImageBitmap(file).then(function(bmp){
      var max=2400,w=bmp.width,h=bmp.height,r=Math.min(1,max/Math.max(w,h));
      if(r===1&&file.size<3*1048576) return file;
      var c=document.createElement('canvas');c.width=Math.round(w*r);c.height=Math.round(h*r);
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      return new Promise(function(res){c.toBlob(function(b){res(b||file);},'image/jpeg',0.86);});
    }).catch(function(){return file;});
  }
  function errMsg(e){var c=e&&e.code;
    if(c==='too_large')return '파일이 너무 큽니다 (최대 20MB).';
    if(c==='unsupported_type')return 'JPG, PNG, WEBP, GIF 사진 또는 PDF만 올릴 수 있습니다.';
    if(c==='quota_or_state')return '저장 공간이 가득 찼습니다. 사용하지 않는 사진을 삭제해 주세요.';
    if(c==='rate_limited')return '잠시 후 다시 시도해 주세요.';
    return '업로드하지 못했습니다. 다시 시도해 주세요.';}
  function done(id,msg){render();var p=document.getElementById(id);if(p)p.textContent=msg;}

  function uploadFiles(key,files){
    readForm();
    var v=function(id){var el=document.getElementById(id);return el?el.value:'';};
    var c1=v('up-cap-'+key),c2=v('up-capja-'+key),cty=key==='products'?v('up-cty'):'';
    var list=[].slice.call(files),n=0,failed='',prog=document.getElementById('prog-'+key);
    if(prog)prog.textContent='올리는 중… 0/'+list.length;
    list.reduce(function(p,f){
      return p.then(function(){return prep(f);}).then(function(b){return assets.upload(b,{type:b.type||f.type});})
       .then(function(r){S[key].push({id:r.id,caption:c1,captionJa:c2,country:cty});dirty=true;})
       .catch(function(e){failed=errMsg(e);})
       .then(function(){n++;if(prog)prog.textContent='올리는 중… '+n+'/'+list.length;});
    },Promise.resolve()).then(function(){done('prog-'+key,failed||'올렸습니다. "저장하고 게시"를 눌러 반영하세요.');});
  }
  function uploadHero(f){
    readForm();var prog=document.getElementById('prog-hero');if(prog)prog.textContent='올리는 중…';
    prep(f).then(function(b){return assets.upload(b,{type:b.type||f.type});}).then(function(r){
      if(S.hero&&!inGallery(S.hero))removed.push(S.hero);S.hero=r.id;dirty=true;done('prog-hero','올렸습니다. 저장하고 게시하세요.');
    }).catch(function(e){if(prog)prog.textContent=errMsg(e);});
  }
  function uploadBrochure(l,f){
    readForm();var prog=document.getElementById('prog-br');if(prog)prog.textContent='올리는 중…';
    assets.upload(f,{type:f.type||'application/pdf'}).then(function(r){
      if(S.brochure[l])removed.push(S.brochure[l].id);
      S.brochure[l]={id:r.id,name:f.name,size:r.sizeBytes,type:r.contentType};dirty=true;
      done('prog-br',(l==='ja'?'일본어':'한국어')+' 소개서를 올렸습니다. 저장하고 게시하세요.');
    }).catch(function(e){if(prog)prog.textContent=errMsg(e);});
  }
  function inGallery(id){return S.factory.concat(S.products).some(function(x){return x.id===id;});}

  function save(){
    if(saving)return;readForm();saving=true;render();
    var gone=removed.filter(function(id){return id!==S.hero&&!inGallery(id);});
    api('PUT','/api/site',S).then(function(){
      dirty=false;saving=false;removed=[];gone.forEach(function(id){assets.delete(id).catch(function(){});});
      render();status('저장했습니다. 사이트에 반영되었습니다.');
    }).catch(function(e){saving=false;render();status(e&&e.code==='unauthorized'?'로그인이 만료되었습니다. /admin 에서 다시 로그인해 주세요.':'저장하지 못했습니다. 다시 눌러 주세요.');});
  }

  function setLang(l){
    readForm(); lang=l; try{localStorage.setItem('wc-lang',l);}catch(_){}

  document.addEventListener('input',function(e){if(e.target.closest('#info-form')||e.target.matches('[data-f]'))setDirty();});
  document.addEventListener('change',function(e){var t=e.target;if(!t.files||!t.files.length)return;
    if(t.id==='file-factory')uploadFiles('factory',t.files);
    else if(t.id==='file-products')uploadFiles('products',t.files);
    else if(t.id==='file-hero')uploadHero(t.files[0]);
    else if(t.id==='file-br-ko')uploadBrochure('ko',t.files[0]);
    else if(t.id==='file-br-ja')uploadBrochure('ja',t.files[0]);

  document.addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t)return;var d=t.dataset;
    if(d.go){var el=document.getElementById(d.go);if(el)el.scrollIntoView({block:'start'});return;}
    if(d.lang){setLang(d.lang);return;}
    if(t.id==='toggle'){readForm();editing=!editing;render();return;}
    if(t.id==='save'){save();return;}
    if(t.id==='logout'){api('POST','/api/logout').then(function(){location.href='/';});return;}
    if(d.copy!=null){var lb=T[lang];
      try{navigator.clipboard.writeText(d.copy).then(function(){t.textContent=lb.copied;setTimeout(function(){t.textContent=lb.copy;},1500);},function(){sel(t);});}catch(_){sel(t);}return;}
    if(d.pick){if(!assets){status('관리자 로그인 후 올릴 수 있습니다.');return;}document.getElementById('file-'+d.pick).click();return;}
    if(d.hero!=null){readForm();if(S.hero&&!inGallery(S.hero))removed.push(S.hero);S.hero=d.hero||null;dirty=true;render();return;}
    if(d.del){readForm();var p=d.del.split(':'),it=S[p[0]][+p[1]];
      if(d.armed){S[p[0]].splice(+p[1],1);if(S.hero===it.id)S.hero=null;removed.push(it.id);dirty=true;render();}
      else{d.armed='1';t.textContent='한 번 더 누르면 삭제';}return;}
    if(d.move){readForm();var m=d.move.split(':'),a=S[m[0]],i=+m[1];if(i>0){var x=a[i];a[i]=a[i-1];a[i-1]=x;dirty=true;render();}return;}
    if(d.zoom){var z=d.zoom.split(':'),item=S[z[0]][+z[1]];
      var box=document.createElement('div');box.className='lb';box.setAttribute('role','dialog');
      box.innerHTML='<button type="button" class="x" aria-label="'+T[lang].close+'">×</button><img src="'+blob(item.id)+'" alt=""><p>'+esc(cap(item)+(item.country?' · '+item.country:''))+'</p>';
      box.addEventListener('click',function(ev){if(ev.target.tagName!=='IMG')box.remove();});
      document.body.appendChild(box);box.querySelector('.x').focus();}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){var b=document.querySelector('.lb');if(b)b.remove();}});
  function sel(btn){var v=btn.previousElementSibling,r=document.createRange();r.selectNodeContents(v);var s=getSelection();s.removeAllRanges();s.addRange(r);}
  window.addEventListener('beforeunload',function(e){if(dirty&&!saving){e.preventDefault();e.returnValue='';}});

  function api(method,url,body){
    var o={method:method,credentials:'same-origin',headers:{}};
    if(body instanceof FormData)o.body=body;else if(body!==undefined){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body);}
    return fetch(url,o).then(function(r){return r.json().catch(function(){return {};}).then(function(j){
      if(!r.ok){var e=new Error(j.error||r.statusText);e.code=j.code||(r.status===401?'unauthorized':r.status===413?'too_large':'upstream_error');throw e;}return j;});});
  }
  var adminApi={
    upload:function(b,opts){var type=(opts&&opts.type)||b.type;var fd=new FormData();
      fd.append('file',b.type===type?b:new Blob([b],{type:type}),b.name||('upload.'+(type.split('/')[1]||'bin')));return api('POST','/api/upload',fd);},
    delete:function(id){return api('DELETE','/api/upload/'+encodeURIComponent(id));}
  };

  render();
